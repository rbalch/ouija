[package]
name = "ouija"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Ask a System One decision model typed questions (yes/no, choice, score) from the shell"
license = "Apache-2.0"
repository = "https://github.com/rbalch/ouija"
readme = "README.md"
keywords = ["cli", "llm", "decision", "shell", "classifier"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.2"
ureq = "3.5.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
